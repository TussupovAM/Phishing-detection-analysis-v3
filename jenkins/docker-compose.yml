# Local Jenkins for the CI/CD assignment:  docker compose up -d --build   (from this folder)
# Then open http://localhost:8080 and unlock with:  docker compose exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
services:
  jenkins:
    build: .
    container_name: jenkins
    # root is needed to use the mounted Docker socket; acceptable for a local lab, NOT for production
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
