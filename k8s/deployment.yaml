apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishing-detector
  labels:
    app: phishing-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phishing-detector
  template:
    metadata:
      labels:
        app: phishing-detector
    spec:
      containers:
        - name: api
          image: phishing-detector:latest
          # The image is loaded into Minikube with "minikube image load", so never pull from a registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
